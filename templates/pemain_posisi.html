<h2>Player Choose (1)</h2>
<title>Player(1) Choose</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<form method="POST">
  Pilih Posisi:
  <select name="posisi">
    {% for pos in posisi_list %}<option value="{{ pos }}">{{ pos }}</option>{% endfor %}
  </select>
  <button type="submit">Generate</button>
</form>
{% if hasil %}
<p>Player 1: {{ hasil["Player 1"] }}</p>
<p>Player 2: {{ hasil["Player 2"] }}</p>
{% endif %}
<a href="/">Back to Menu</a>
<div class="credit">
  <img src="{{ url_for('static', filename='cind.png') }}" alt="logo" class="credit-img">
  <span>@モブノ王子</span>
</div>
